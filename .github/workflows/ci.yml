name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (core + api + dev extras)
        run: |
          pip install -e ".[api,dev]" httpx

      - name: Validator gate — committed submission.csv must pass shape checks
        run: python scripts/validate_submission.py submission.csv

      - name: Test suite (golden-hash regression + pipeline + API)
        env:
          PYTHONHASHSEED: "0"
        run: |
          set -o pipefail
          status=0
          python -m pytest -q 2>&1 | tee /tmp/pytest.out || status=$?
          if [ "$status" -ne 0 ]; then
            # Surface the failure as annotations (publicly readable via the
            # checks API) since raw logs require authentication.
            tail -10 /tmp/pytest.out | while IFS= read -r line; do
              echo "::error::pytest: ${line}"
            done
          fi
          exit "$status"
