<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redrob Real-Time Ranker</title>
  <style>
    :root {
      --bg: #0f172a;
      --glass-bg: rgba(15, 23, 42, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --gold: #fbbf24;
      --silver: #94a3b8;
      --bronze: #b45309;
      --danger: #f87171;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      background: var(--bg) url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" fill="none" /><circle cx="50" cy="50" r="40" stroke="rgba(255,255,255,0.02)" stroke-width="1" fill="none" /></svg>') center/cover fixed;
      color: var(--text);
      line-height: 1.5;
    }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transform: translateZ(0); /* GPU acceleration */
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 0 0 16px 16px;
      margin-bottom: 30px;
    }
    
    header h1 {
      margin: 0;
      font-size: 24px;
      background: linear-gradient(90deg, #f8fafc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .mode-toggle {
      display: flex;
      gap: 10px;
      background: rgba(0,0,0,0.3);
      padding: 5px;
      border-radius: 8px;
    }

    .mode-toggle button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .mode-toggle button.active {
      background: var(--accent);
      color: #000;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    .metric-container {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .metric {
      flex: 1;
      padding: 20px;
      text-align: center;
    }

    .metric h3 {
      margin: 0;
      font-size: 36px;
      color: var(--accent);
    }

    .metric p {
      margin: 5px 0 0;
      color: var(--text-muted);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    #upload-zone {
      display: none;
      padding: 60px;
      text-align: center;
      margin-bottom: 30px;
      border: 2px dashed var(--accent);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    #upload-zone:hover {
      background: rgba(56, 189, 248, 0.1);
    }
    
    #upload-zone.dragover {
      background: rgba(56, 189, 248, 0.2);
      border-color: #fff;
    }

    #loading {
      display: none;
      text-align: center;
      padding: 40px;
      font-size: 20px;
      color: var(--accent);
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .candidate {
      margin: 15px 0;
      padding: 20px;
      position: relative;
      border-left: 4px solid var(--accent);
      transition: transform 0.2s;
    }
    
    .candidate:hover {
      transform: translateX(5px);
    }

    .rank-1 { border-left-color: var(--gold); box-shadow: 0 0 20px rgba(255, 215, 0, 0.1); }
    .rank-2 { border-left-color: var(--silver); box-shadow: 0 0 20px rgba(192, 192, 192, 0.1); }
    .rank-3 { border-left-color: var(--bronze); box-shadow: 0 0 20px rgba(205, 127, 50, 0.1); }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .title-area h2 {
      margin: 0;
      font-size: 20px;
      color: #f8fafc;
    }

    .meta {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .score {
      font-size: 24px;
      font-weight: bold;
      color: var(--accent);
    }

    .rank-badge {
      position: absolute;
      top: -12px;
      left: -12px;
      background: var(--accent);
      color: #0f172a;
      width: 32px;
      height: 32px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .rank-1 .rank-badge { background: var(--gold); }
    .rank-2 .rank-badge { background: var(--silver); }
    .rank-3 .rank-badge { background: var(--bronze); }

    .reasoning {
      color: #cbd5e1;
      font-size: 15px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--glass-border);
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      margin: 0 4px 4px 0;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      font-size: 12px;
    }
    
    .tag-hp {
      background: rgba(248, 113, 113, 0.2);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.5);
    }
  </style>
</head>
<body>

  <header class="glass">
    <h1>Redrob HireFit Engine</h1>
    <div class="mode-toggle">
      <button id="btn-showpiece" class="active" onclick="setMode('showpiece')">Showpiece (100K)</button>
      <button id="btn-live" onclick="setMode('live')">Live Proof (≤500)</button>
    </div>
  </header>

  <div class="container">
    
    <div id="upload-zone" class="glass" onclick="document.getElementById('file-input').click()">
      <h3>Drop <code>candidates.jsonl</code> here or click to upload</h3>
      <p>Proves the pipeline is real. Processes up to 500 candidates synchronously.</p>
      <input type="file" id="file-input" style="display: none" accept=".jsonl" onchange="handleFile(this.files[0])">
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <div>Running Pipeline in Real-Time...</div>
    </div>

    <div id="metrics" class="metric-container"></div>
    <div id="candidates"></div>

  </div>

  <script>
    let currentMode = 'showpiece';

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-showpiece').className = mode === 'showpiece' ? 'active' : '';
      document.getElementById('btn-live').className = mode === 'live' ? 'active' : '';
      
      const uploadZone = document.getElementById('upload-zone');
      const metrics = document.getElementById('metrics');
      const candidates = document.getElementById('candidates');
      
      if (mode === 'live') {
        uploadZone.style.display = 'block';
        metrics.innerHTML = '';
        candidates.innerHTML = '';
      } else {
        uploadZone.style.display = 'none';
        loadShowpiece();
      }
    }

    async function loadShowpiece() {
      showLoading(true);
      try {
        const res = await fetch('/api/results');
        const data = await res.json();
        renderData(data);
      } catch (e) {
        alert("Error loading showpiece data. Did you run generate_data?");
      } finally {
        showLoading(false);
      }
    }

    async function handleFile(file) {
      if (!file) return;
      showLoading(true);
      document.getElementById('candidates').innerHTML = '';
      document.getElementById('metrics').innerHTML = '';
      
      const formData = new FormData();
      formData.append('file', file);
      
      try {
        const start = performance.now();
        const res = await fetch('/api/rank', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        
        // If the backend didn't supply processing time, add it for the UI
        if (!data.metadata.processing_time_ms) {
          data.metadata.processing_time_ms = performance.now() - start;
        }
        
        renderData(data);
      } catch (e) {
        alert("Error processing file in real-time.");
        console.error(e);
      } finally {
        showLoading(false);
      }
    }

    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'block' : 'none';
      if (show) {
         document.getElementById('upload-zone').style.display = 'none';
      } else if (currentMode === 'live') {
         document.getElementById('upload-zone').style.display = 'block';
      }
    }

    function renderData(data) {
      // Render Metrics
      const m = data.metadata;
      const timeStr = m.processing_time_ms > 1000 
        ? (m.processing_time_ms/1000).toFixed(1) + 's' 
        : Math.round(m.processing_time_ms) + 'ms';
        
      document.getElementById('metrics').innerHTML = `
        <div class="metric glass"><h3>${m.total_candidates.toLocaleString()}</h3><p>Candidates Processed</p></div>
        <div class="metric glass"><h3>${m.ranked_count.toLocaleString()}</h3><p>Ranked Output</p></div>
        <div class="metric glass"><h3>${m.honeypots_blocked}</h3><p>Honeypots Blocked</p></div>
        <div class="metric glass"><h3>${timeStr}</h3><p>Pipeline Runtime</p></div>
      `;
      
      // Render Candidates
      const container = document.getElementById('candidates');
      let html = '';
      
      data.candidates.forEach(r => {
          const rankClass = r.rank <= 3 ? `rank-${r.rank}` : '';
          const reasoning = r.reasoning || '';
          const hpTag = reasoning.toLowerCase().includes("honeypot") ? `<span class="tag tag-hp">HONEYPOT</span>` : '';
          
          html += `
          <div class="candidate glass ${rankClass}">
              <div class="rank-badge">${r.rank}</div>
              <div class="header-row">
                  <div class="title-area">
                      <h2>${r.title} @ ${r.company} ${hpTag}</h2>
                      <div class="meta">${r.candidate_id} | ${r.yoe} Years Exp | ${r.location}</div>
                  </div>
                  <div class="score">
                      ${parseFloat(r.score).toFixed(4)}
                  </div>
              </div>
              <div class="reasoning">
                  <strong>Audit Log:</strong> ${reasoning}
              </div>
          </div>
          `;
      });
      
      container.innerHTML = html;
    }

    // Drag and drop support
    const dropZone = document.getElementById('upload-zone');
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    // Initial load
    setMode('showpiece');
  </script>
</body>
</html>
