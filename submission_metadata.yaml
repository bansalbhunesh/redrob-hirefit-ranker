ai_usage_summary: |
  Used Codex for architecture planning, implementation scaffolding, documentation,
  and test generation. No candidate data is sent to hosted LLM APIs during ranking.

methodology_summary: |
  Offline Plan D v2 ranker for the Senior AI Engineer JD. BM25 provides lexical
  fit (bm25s preferred, rank-bm25 fallback), while a deterministic 28-feature
  matrix scores skills, career, experience, behavior, and logistics. The final
  score applies multiplicative behavioral, honeypot, and JD-disqualifier
  multipliers. No hosted LLM/API scoring is used during ranking; reasoning is
  generated from actual candidate facts and feature triggers.

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
