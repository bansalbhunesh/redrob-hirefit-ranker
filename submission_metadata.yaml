ai_usage_summary: |
  Used Codex for architecture planning, implementation scaffolding, documentation,
  and test generation. Claude Code (Anthropic) did a later engineering pass:
  profiling and parallelising feature scoring for runtime margin, building the
  independent (non-circular) evaluation harness, adding the LLM-wrapper and
  junior-for-senior soft JD penalties, and improving reasoning variety; all
  verified against the test suite and the format validator. Claude/Kimi audit
  notes were used as offline design-review references. No candidate data is sent
  to hosted LLM APIs during ranking.

methodology_summary: |
  Offline ranker for the Senior AI Engineer JD. Production rank.py: BM25 lexical
  fit (bm25s preferred, rank-bm25 fallback) + a deterministic 33-feature matrix
  (skills, career evidence, seniority, role-family depth, behavior, logistics)
  with multiplicative behavioral, honeypot, and JD-disqualifier multipliers; no
  hosted LLM/API scoring during ranking; reasoning generated from actual candidate
  facts. The committed artifact is produced by the fail-closed `--release` path
  (ranking profile frontier-v5): seven shallow label-family heads distilled to a
  130 KB NumPy artifact, blended with ungated universal-v2 relevance, then passed
  through the existing integrity multipliers. A conservative RRF lock is followed
  by a feature-only top-eight correction, two clean backfills for the lowest-ranked
  severe temporal contradictions, and two narrow feature-only tie-breaks
  (behaviour and responsiveness within fixed rank windows) that were retained only
  after holdout half-splits eliminated a broader rule set; their effect is marginal
  and within proxy noise. The `dominant-v4` profile (same pipeline without those
  two tie-breaks) and the default `main` profile remain available. No competitor
  code, candidate IDs, public ranks, or paragraph fingerprints are in production.
  All quality numbers are development proxies; no official hidden labels were
  available.

