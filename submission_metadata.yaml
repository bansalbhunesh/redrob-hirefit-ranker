ai_usage_summary: |
  Used Codex for architecture planning, implementation scaffolding, documentation,
  and test generation. Claude/Kimi audit notes were used as offline design-review
  references. No candidate data is sent to hosted LLM APIs during ranking.

methodology_summary: |
  Offline Plan D v2 ranker for the Senior AI Engineer JD. BM25 provides lexical
  fit (bm25s preferred, rank-bm25 fallback), while a deterministic 28-feature
  matrix scores skills, career, experience, behavior, and logistics. The final
  score applies multiplicative behavioral, honeypot, and JD-disqualifier
  multipliers. Salary inversion and endorsement inflation are treated as soft
  disqualifier signals rather than hard honeypots. No hosted LLM/API scoring is
  used during ranking; reasoning is generated from actual candidate facts and
  feature triggers. A heuristic silver-label harness is included for development
  and defense, not as a claim about the hidden challenge labels.

