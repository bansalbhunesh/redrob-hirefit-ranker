[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redrob-hirefit-ranker"
version = "0.1.0"
description = "CPU-only candidate ranking system for the Redrob India Runs Data & AI Challenge"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "orjson>=3.10,<4",
  "bm25s>=0.2,<1",
  "rank-bm25>=0.2.2,<1",
]

[project.optional-dependencies]
demo = [
  "pandas>=2.2,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "gradio>=4.44,<6",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "psutil>=5.9,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
