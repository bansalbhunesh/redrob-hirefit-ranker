[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redrob-hirefit-ranker"
version = "0.1.0"
description = "CPU-only candidate ranking system for the Redrob India Runs Data & AI Challenge"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "orjson>=3.10,<4",
  "bm25s>=0.2,<1",
  "rank-bm25>=0.2.2,<1",
]

[project.optional-dependencies]
# Dashboard backend (apps/api). starlette floor carries the PYSEC-2026-161 fix;
# keep this extra separate from `demo` because gradio pins starlette<1.0.
api = [
  "fastapi>=0.136,<1",
  "starlette>=1.0.1,<2",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18,<1",
]
# Gradio demos (apps/space, hf_space). gradio>=6.7 carries the PYSEC-2026-63/64/65/66
# fixes; pillow floor carries the 2026 pillow CVE fixes pulled in via gradio.
demo = [
  "pandas>=2.2,<3",
  "gradio>=6.7,<7",
  "pillow>=12.2,<13",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "psutil>=5.9,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
