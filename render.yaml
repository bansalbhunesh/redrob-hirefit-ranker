# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: redrob-hirefit-ranker
    runtime: python
    plan: free
    buildCommand: pip install -e ".[api]"
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/readyz
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: PYTHONHASHSEED
        value: "0"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: REDROB_MAX_LIVE_CANDIDATES
        value: "500"
      - key: REDROB_MAX_BATCH_CANDIDATES
        value: "5000"
      - key: REDROB_MAX_EXPANDED_UPLOAD_BYTES
        value: "33554432"
      - key: REDROB_MAX_CANDIDATE_RECORD_BYTES
        value: "1048576"
      - key: REDROB_RATE_LIMIT_PER_MINUTE
        value: "120"

previews:
  generation: manual
  expireAfterDays: 3
